name: CI

permissions:
  contents: read
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  CI:
    if: ${{ github.repository == 'googleapis/google-api-ruby-client' }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            ruby: "3.2"
            task: "--include-spec"
          - os: ubuntu-latest
            ruby: "3.3"
            task: "--include-spec"
          - os: ubuntu-latest
            ruby: "3.4"
            task: "--include-spec"
          - os: ubuntu-latest
            ruby: "4.0"
            task: "--include-spec --include-yardoc --include-build"
            rubyopt: "--enable-frozen-string-literal --debug-frozen-string-literal"
          - os: macos-latest
            ruby: "4.0"
            task: "--include-spec"
          - os: windows-latest
            ruby: "4.0"
            task: "--include-spec"
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repo
      uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
      with:
        persist-credentials: false
    - name: Install Ruby ${{ matrix.ruby }}
      uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1.314.0
      with:
        ruby-version: "${{ matrix.ruby }}"
    - name: Install tools
      run: |
        gem install --no-document toys
    - name: Hack perms
      # Hack permissions to avoid a bundler issue.
      # See https://github.com/actions/runner-images/issues/10215
      # and https://github.com/rubygems/rubygems/issues/7983.
      shell: bash
      run: |
        if [ -d /opt/hostedtoolcache/Ruby ]; then
          chmod -R o-w /opt/hostedtoolcache/Ruby
        fi
    - name: Test ${{ matrix.task }} ${{ matrix.rubyopt }}
      # bash on every OS (including windows-latest, whose default is pwsh) so
      # the runner's default GITHUB_EVENT_* variables expand the same way.
      shell: bash
      run: |
        toys ci -v --only ${{ matrix.task }} --github-event-name="${GITHUB_EVENT_NAME}" --github-event-payload="${GITHUB_EVENT_PATH}"
      env:
        RUBYOPT: "${{ matrix.rubyopt }}"
